# This is a basic workflow to help you get started with Actions

name: Testing
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Run the test suite on every supported Python version.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14', '3.15', '3.16']

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install required dpkg packages
        run: sudo apt-get install libxslt1-dev bzr subversion mercurial

      - name: Generate default locales
        run: |
          sudo apt-get update && sudo apt-get install tzdata locales -y && sudo locale-gen "en_US.UTF-8"
          sudo dpkg-reconfigure locales
          sudo update-locale "LANG=en_US.UTF-8"
          sudo update-locale "LC_ALL=en_US.UTF-8"
          locale

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          locale
          make test

  # Lint with the pinned toolchain (pylint < 2.14 in requirements.txt),
  # which only runs on Python < 3.14: its astroid still uses the ast.Str
  # and ast.Num node classes that were removed from the ast module in
  # Python 3.14. Running the linters on a single stable interpreter is
  # sufficient, as they do not depend on the runtime version under test.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install required dpkg packages
        run: sudo apt-get install libxslt1-dev bzr subversion mercurial

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: make flake8

      - name: Lint code with pylint
        run: make pylint

      - name: Lint test with pylint
        run: make pylinttest
